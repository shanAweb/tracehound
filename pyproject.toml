[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tracehound"
dynamic = ["version"]
description = "Offline, dependency-graph root-cause engine for distributed systems."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shan Asif" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "networkx>=3.3",
]
keywords = ["root-cause-analysis", "observability", "tracing", "sre", "anomaly-detection"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.5"]
pandas = ["pandas>=2.2"]

[project.urls]
Homepage = "https://github.com/shanAweb/tracehound"
Issues = "https://github.com/shanAweb/tracehound/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.version]
path = "src/tracehound/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tracehound"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-ra --strict-markers --strict-config --doctest-modules"
xfail_strict = true
